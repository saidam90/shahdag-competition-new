<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Set your password · ISMF World Championships Shahdag 2027</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/auth/auth.css" />
  </head>
  <body>
    <main>
      <img class="logo" src="/auth/shahdag-logo.webp" alt="Shahdag" />
      <h1>Set your password</h1>
      <p class="intro">
        Use the email address you were invited with, then choose a password
        of at least 10 characters.
      </p>
      <p class="error" id="error" role="alert" hidden></p>
      <form method="post" action="/api/set-password">
        <label>
          Email
          <input type="email" name="email" autocomplete="email" required />
        </label>
        <label>
          New password
          <input
            type="password"
            name="password"
            autocomplete="new-password"
            minlength="10"
            required
          />
        </label>
        <label>
          Confirm password
          <input
            type="password"
            name="confirm"
            autocomplete="new-password"
            minlength="10"
            required
          />
        </label>
        <button type="submit">Set password and sign in</button>
      </form>
      <p class="footer">
        Already set one? <a href="/login">Sign in</a>
      </p>
    </main>
    <script src="/auth/auth.js"></script>
  </body>
</html>
